<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro-Devsetup</title>
</head>
</head>
<body>
       <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:'Segoe UI', Tahoma, Geneva,
                Verdana, sans-serif;
                background-color: #ffffff;
                color: #333333;
                line-height: 1.6;
        }

        h1,h2,h3 {
            color: #1a1a1a;
            margin-bottom: 1rem;
        }

        p {
            margin-bottom: 1rem;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        .cabecalhoPrincipal {
            background-color: #ffffff;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nomeLogo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #dd86a4;
            font-size: 3rem;color: #dd86a4 ;
        }

        .listaNavegacao {
            display: flex;
            gap: 2rem;
        }


        .listaNavegacao ul {
            display: flex;
            gap: 2rem;
        }

        .linkNav {
            font-weight: 600;
            transition: color 0.3s ease;
            font-family: sans-serif;
        }

        .linkNav:hover {
            color: #dd86a4;
            font-family: sans-serif;
        }

            .botaoPrincipal {
                display: inline-block;
                background-color: #dd86a4;
                color: aliceblue;
                padding: 0.8rem 1.5rem;
                border-radius: 4px;
                font-weight: bold;
                margin-top: 1rem;
            }

              .botaoPrincipal:hover {
            background-color: #966c51;
            color: #ffffff;
        }
        .container {
            padding: 4rem 5%;
        }

        .tituloSecao {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }

        .gradeProdutos {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap
        }

            .container {
                padding: 4rem 5%;
            }

            .tituloSecao {
                text-align: center;
                font-size: 2,5rem;
                margin-bottom: 2rem;
            }

            .gradeProdutos {
                display: flex;
                gap: 2rem;
                justify-content: center;
                flex-wrap: wrap;
            }

            .cartaoProduto {
                background-color: #ffffff;
                border-radius: 8px;
                padding: 1.5rem;
                width: 300px;
                box-shadow: 0 10px 10px rgba(0, 0, 0, 0.3);
                text-align: center;
                transition: transform 0.3s ease;
            }

            .cartaoProduto:hover {
                transform: translateY(-5px);
            }

            .rodapePrincipal {
            background-color: #a39279;
            color: #ffffff;
            padding: 3rem 5%;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .rodapePrincipal h2,
        .rodapePrincipal h1 {
            color: #ffffff;
        }
        .letrasBonitas {
            font-weight: bold;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 1.5rem;
            color: #a39279;
        }
    </style>
<body>
    <header>
        <h1>crie sua conta na devsetup</h1>
        <nav>
            <a href="index.html">voltar para a pagina inicial</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>formulário de cadastro</h2>
            <form>
                <label for="nome">nome completo:</label><br>
                <input 
                type="text" 
                id="nome" 
                name="nome"
                placeholder="digite seu nome completo"
                required>
                <br><br>
                <label for="email">email:</label><br><br>
                <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="digite seu email"
                required>
                <br><br>
                <label for="senha">senha:</label><br><br>
                <input 
                type="password" 
                id="senha" 
                name="senha"
                placeholder="digite sua senha" 
                required>
                <br><br>

                <label>Nível do Cliente:</label><br>
                <input 
                type="radio" 
                id="comum" 
                name="nível" 
                value="comum">
                <label for="comum">Cliente comum</label><br>
                <input 
                type="radio" 
                id="empresa" 
                name="nivel" 
                value="empresa">
                <label for="comum">cliente comum</label><br>
                <input 
                type="radio" 
                id="empresa" name="nivel" 
                value="empresa">
                <label for="empresa">empresa (CNPJ)</label><br><br>
                <label for="interesse">area de interesse</label>
                <select 
                name="interesse" 
                id="interesse">
                <option value="hardware">hardware</option>
                <option value="perifericos">periféricos</option>
                <option value="desenvolvimento">desenvolvimento</option>
                </select><br><br>
                <button>
                    <type="submit">Enviar Cadastro</button>
                    </form>
        </section>
    </main>
    
</body>
</html>
